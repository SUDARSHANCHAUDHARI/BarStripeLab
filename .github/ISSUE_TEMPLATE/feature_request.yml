name: Feature Request
description: Suggest an idea for BarStripeLab
title: "[FEATURE] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Share your feature idea!

  - type: textarea
    id: problem
    attributes:
      label: Problem/Use Case
      description: What problem does this solve?
      placeholder: Currently, users cannot... It would be useful if...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
      placeholder: Users should be able to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Any other ways to solve this?
      placeholder: We could also...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other info
